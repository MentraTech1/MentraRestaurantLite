<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A">
    <title>MentraRestaurant Lite | بوابة الدخول والوصول</title>
    <link rel="icon" href="assets/logo.png">
    
    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
    <script src="assets/Tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & Dexie -->
    <script crossorigin src="assets/react.production.min.js"></script>
    <script crossorigin src="assets/react-dom.production.min.js"></script>
    <script src="assets/babel.min.js"></script>
    <script src="assets/dexie.min.js"></script>
    <script src="database.js"></script>

    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #0B1120;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .bg-shapes { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .shape { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.22; animation: float 18s infinite alternate ease-in-out; }
        .shape-1 { background: #EA580C; width: 450px; height: 450px; top: -120px; right: -100px; }
        .shape-2 { background: #F97316; width: 350px; height: 350px; bottom: -80px; left: -80px; animation-delay: -6s; }
        .shape-3 { background: #6366F1; width: 300px; height: 300px; top: 40%; left: 30%; opacity: 0.12; }
        
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-40px, 60px) scale(1.08); } }

        .input-group { position: relative; }
        .input-field {
            width: 100%; padding: 0.95rem 1rem 0.95rem 2.85rem; border-radius: 1rem;
            border: 2px solid #E2E8F0; background: #F8FAFC; outline: none;
            color: #0F172A; font-weight: 700; font-size: 0.95rem; transition: all 0.25s ease;
        }
        .input-field:focus { border-color: #EA580C; background: #FFFFFF; box-shadow: 0 4px 20px rgba(234, 88, 12, 0.12); }
        .input-icon { position: absolute; top: 50%; left: 1.1rem; transform: translateY(-50%); color: #94A3B8; transition: color 0.25s ease; pointer-events: none; }
        .input-field:focus ~ .input-icon { color: #EA580C; }
        
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-up { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6 selection:bg-[#EA580C] selection:text-white relative">
    
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
	
    <!-- زر الرجوع للرئيسية -->
    <a href="index.html" class="absolute top-4 left-4 sm:top-6 sm:left-6 z-50 flex items-center gap-2 text-white/80 hover:text-white transition-all text-xs sm:text-sm font-bold bg-white/10 hover:bg-white/20 px-3.5 py-2 rounded-xl backdrop-blur-md border border-white/10 shadow-sm">
        <i class="fas fa-arrow-left"></i> <span>الرئيسية</span>
    </a>

    <!-- اللودر المبدئي الفوري -->
    <style>
        #sub-loader { position:fixed; inset:0; background:#0B1120; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.3s ease; }
        #sub-loader.hidden { opacity:0; pointer-events:none; }
        .sub-spinner { width:46px; height:46px; border:4px solid rgba(255,255,255,0.1); border-top-color:#EA580C; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
    <div id="sub-loader">
        <div style="width:58px;height:58px;background:linear-gradient(135deg,#EA580C,#F97316);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 10px 25px rgba(234,88,12,0.4)">
            <i class="fas fa-utensils text-white text-2xl"></i>
        </div>
        <div class="sub-spinner"></div>
        <p style="margin-top:14px;font-family:system-ui,sans-serif;font-weight:800;color:#94A3B8;font-size:13px">MentraResto جاري التحميل...</p>
    </div>
    
    <script>
        var subLoader = document.getElementById("sub-loader");
        document.addEventListener("DOMContentLoaded", function() {
            var root = document.getElementById("root");
            if (!root) return;
            var subObs = new MutationObserver(function(){
                if(root.children.length > 0){
                    subLoader.classList.add("hidden");
                    setTimeout(function(){ subLoader.remove(); }, 400);
                    subObs.disconnect();
                }
            });
            subObs.observe(root, {childList:true});
        });
    </script>
    
    <div id="root" class="relative z-10 w-full flex items-center justify-center my-auto py-8"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function SubscriptionsApp() {
            const [isChecking, setIsChecking] = useState(true);
            const [activeTab, setActiveTab] = useState('login'); // fast-login, login, register, recover
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            
            const [availableRestaurants, setAvailableRestaurants] = useState([]);
            const [selectedDbForLogin, setSelectedDbForLogin] = useState('');

            // الدخول السريع
            const [savedUsers, setSavedUsers] = useState([]);
            const [selectedSavedUser, setSelectedSavedUser] = useState(null);
            const [fastLoginPassword, setFastLoginPassword] = useState('');

            // تسجيل جديد
            const [formData, setFormData] = useState({
                restaurantName: '', ownerName: '', phone: '', password: ''
            });

            // استعادة كلمة المرور بمفتاح الأمان
            const [recoveryData, setRecoveryData] = useState({
                phone: '', securityKey: '', newPassword: ''
            });

            useEffect(() => {
                const initApp = async () => {
                    try {
                        const activeSession = localStorage.getItem('MentraRestaurant_Session');
                        if (activeSession) {
                            window.location.replace('dashboard.html');
                            return;
                        }

                        await window.masterDb.open();
                        const restaurantsList = await window.masterDb.restaurants.toArray();
                        setAvailableRestaurants(restaurantsList);

                        if (restaurantsList.length > 0) {
                            setSelectedDbForLogin(restaurantsList[0].dbName);
                            
                            let allUsers = [];
                            for (let rest of restaurantsList) {
                                await window.initRestaurantDB(rest.dbName);
                                const users = await window.db.users.toArray();
                                users.forEach(u => allUsers.push({ ...u, restaurant_name: rest.restaurantName, dbName: rest.dbName }));
                            }

                            if (allUsers.length > 0) {
                                setSavedUsers(allUsers);
                                const lastUserId = localStorage.getItem('MentraRestaurant_LastUserID');
                                const defaultUser = allUsers.find(u => u.id == lastUserId) || allUsers[0];
                                setSelectedSavedUser(defaultUser);
                                setActiveTab('fast-login');
                            }
                        }

                        setTimeout(() => setIsChecking(false), 500);
                    } catch (err) {
                        console.error("خطأ في التهيئة:", err);
                        setIsChecking(false);
                    }
                };
                initApp();
            }, []);

            const handleChange = (e) => { 
                setFormData({ ...formData, [e.target.name]: e.target.value }); 
                setError(''); setSuccessMsg(''); 
            };

            const handleRecoveryChange = (e) => {
                setRecoveryData({ ...recoveryData, [e.target.name]: e.target.value });
                setError(''); setSuccessMsg('');
            };

            // تسجيل الدخول العادي
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true); setError(''); setSuccessMsg('');
                try {
                    const { user, restaurant, dbName } = await window.RestaurantQueries.login(selectedDbForLogin, formData.phone, formData.password);
                    
                    localStorage.setItem('MentraRestaurant_Session', JSON.stringify({
                        user_id: user.id, restaurant_id: restaurant.id, name: user.name, role: user.role, restaurant_name: restaurant.restaurant_name, dbName: dbName
                    }));
                    localStorage.setItem('MentraRestaurant_LastUserID', user.id);
                    window.location.replace('dashboard.html');
                } catch (err) { setError(err.message || "حدث خطأ غير متوقع"); setLoading(false); }
            };

            // الدخول السريع
            const handleFastLogin = async (e) => {
                e.preventDefault();
                if (!selectedSavedUser) return;
                if (!fastLoginPassword) { setError("الرجاء إدخال كلمة المرور"); return; }

                setLoading(true); setError(''); setSuccessMsg('');
                try {
                    const { user, restaurant, dbName } = await window.RestaurantQueries.login(selectedSavedUser.dbName, selectedSavedUser.phone, fastLoginPassword);
                    
                    localStorage.setItem('MentraRestaurant_Session', JSON.stringify({
                        user_id: user.id, restaurant_id: restaurant.id, name: user.name, role: user.role, restaurant_name: restaurant.restaurant_name, dbName: dbName
                    }));
                    localStorage.setItem('MentraRestaurant_LastUserID', user.id);
                    window.location.replace('dashboard.html');
                } catch (err) { setError("كلمة المرور غير صحيحة"); setLoading(false); }
            };

            // تأسيس مطعم جديد
            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true); setError(''); setSuccessMsg('');
                try {
                    const { restaurantId, userId, dbName } = await window.RestaurantQueries.createRestaurant(
                        formData.restaurantName, formData.ownerName, formData.phone, formData.password
                    );

                    localStorage.setItem('MentraRestaurant_Session', JSON.stringify({
                        user_id: userId, restaurant_id: restaurantId, name: formData.ownerName, role: 'owner', restaurant_name: formData.restaurantName, dbName: dbName
                    }));
                    localStorage.setItem('MentraRestaurant_LastUserID', userId);
                    window.location.replace('dashboard.html');
                } catch (err) { setError(err.message || "حدث خطأ غير متوقع"); setLoading(false); }
            };

            // تجهيز بيانات الاستعادة عند الضغط على "نسيت كلمة المرور"
            const openRecovery = () => {
                setError(''); setSuccessMsg('');
                // التأكد من تزامن قاعدة البيانات المختارة مع الحساب الذي يطلب الاستعادة
                if (activeTab === 'fast-login' && selectedSavedUser) {
                    setRecoveryData({ ...recoveryData, phone: selectedSavedUser.phone });
                    setSelectedDbForLogin(selectedSavedUser.dbName);
                } else if (activeTab === 'login') {
                    setRecoveryData({ ...recoveryData, phone: formData.phone });
                }
                setActiveTab('recover');
            };

            // 🔐 دالة استعادة الحساب بمفتاح الأمان (Security Key Recovery)
const handleRecoverPassword = async (e) => {
    e.preventDefault();
    setLoading(true); setError(''); setSuccessMsg('');
    try {
        const targetDb = selectedDbForLogin; 
        if (!targetDb) throw new Error("يرجى اختيار المطعم أولاً");

        await window.initRestaurantDB(targetDb);
        const user = await window.db.users.where('phone').equals(recoveryData.phone.trim()).first();

        if (!user) throw new Error("رقم الهاتف هذا غير مسجل في المطعم المحدد");

        const cleanInputKey = recoveryData.securityKey.trim().toUpperCase();
        const cleanSavedKey = (user.security_key || '').trim().toUpperCase();

        if (!cleanSavedKey || cleanSavedKey !== cleanInputKey) {
            throw new Error("مفتاح الأمان غير صحيح أو لم يتم تعيين مفتاح أمان لهذا الحساب");
        }

        const newPass = recoveryData.newPassword; 
        if(!newPass) throw new Error("يرجى إدخال كلمة المرور الجديدة");

        // 🔥 الإصلاح هنا: تشفير كلمة المرور بـ btoa قبل الحفظ
        const hashedNewPass = btoa(newPass);

        // تحديث كلمة المرور في قاعدة البيانات بالنسخة المشفرة
        const updatedCount = await window.db.users.where('phone').equals(user.phone).modify({ password: hashedNewPass });
        
        if(updatedCount === 0) {
            throw new Error("عفواً، فشل تحديث كلمة المرور في قاعدة البيانات.");
        }

        setSuccessMsg("تم تعيين كلمة المرور الجديدة بنجاح! جاري تسجيل الدخول...");
        
        // تسجيل الدخول التلقائي فوراً بعد النجاح
        const restaurant = await window.db.restaurant_info.toCollection().first() || { id: 1, restaurant_name: 'المطعم' };
        setTimeout(() => {
            localStorage.setItem('MentraRestaurant_Session', JSON.stringify({
                user_id: user.id, restaurant_id: restaurant.id, name: user.name, role: user.role, restaurant_name: restaurant.restaurant_name, dbName: targetDb
            }));
            localStorage.setItem('MentraRestaurant_LastUserID', user.id);
            window.location.replace('dashboard.html');
        }, 1200);

    } catch (err) {
        setError(err.message || "حدث خطأ أثناء استعادة الحساب");
        setLoading(false);
    }
};

            if (isChecking) { 
                return (
                    <div className="flex flex-col items-center justify-center fade-up">
                        <div className="w-18 h-18 bg-gradient-to-br from-[#EA580C] to-[#F97316] rounded-2xl flex items-center justify-center text-white text-3xl shadow-xl animate-pulse mb-4 p-4">
                            <i className="fas fa-utensils"></i>
                        </div>
                        <h2 className="text-xl font-black text-white">جاري الفحص المباشر...</h2>
                    </div>
                ); 
            }

            return (
                <div className="w-full max-w-[440px] sm:max-w-[460px] fade-up px-2">
                    
                    {/* اللوجو والعنوان */}
                    <div className="text-center mb-6">
                        <div className="w-16 h-16 bg-gradient-to-br from-[#EA580C] to-[#F97316] mx-auto rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-500/25 mb-3 border border-white/10">
                            <i className="fas fa-store"></i>
                        </div>
                        <h1 className="text-2xl sm:text-3xl font-black text-white tracking-tight">Mentra<span className="text-[#F97316]">Resto</span></h1>
                        <p className="text-xs font-bold text-slate-400 mt-0.5">نظام إدارة نقاط البيع والمطاعم الذكي (Offline)</p>
                    </div>

                    <div className="bg-white rounded-[2rem] shadow-2xl overflow-hidden relative border border-slate-100/80">
                        
                        {/* أزرار التبديل العلوية */}
                        {activeTab !== 'fast-login' && activeTab !== 'recover' && (
                            <div className="flex p-1.5 bg-slate-100/80 border-b border-slate-100">
                                <button 
                                    onClick={() => { setActiveTab('login'); setError(''); setSuccessMsg(''); }} 
                                    className={`flex-1 py-3 text-xs sm:text-sm font-black rounded-xl transition-all ${activeTab === 'login' ? 'bg-white text-[#EA580C] shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    دخول الكاشير
                                </button>
                                <button 
                                    onClick={() => { setActiveTab('register'); setError(''); setSuccessMsg(''); }} 
                                    className={`flex-1 py-3 text-xs sm:text-sm font-black rounded-xl transition-all ${activeTab === 'register' ? 'bg-white text-[#EA580C] shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    تأسيس مطعم جديد
                                </button>
                            </div>
                        )}

                        <div className="p-5 sm:p-7">
                            
                            {/* رسائل التنبيه والخطأ */}
                            {error && (
                                <div className="bg-rose-50 border border-rose-200 text-rose-600 p-3.5 rounded-xl text-xs font-bold mb-5 flex items-start gap-2.5 fade-up">
                                    <i className="fas fa-exclamation-circle text-base shrink-0 mt-0.5"></i>
                                    <span>{error}</span>
                                </div>
                            )}

                            {successMsg && (
                                <div className="bg-emerald-50 border border-emerald-200 text-emerald-600 p-3.5 rounded-xl text-xs font-bold mb-5 flex items-start gap-2.5 fade-up">
                                    <i className="fas fa-check-circle text-base shrink-0 mt-0.5"></i>
                                    <span>{successMsg}</span>
                                </div>
                            )}

                            {/* 1. الدخول السريع (Fast Login) */}
                            {activeTab === 'fast-login' && selectedSavedUser && (
                                <form onSubmit={handleFastLogin} className="text-center fade-up space-y-4">
                                    {savedUsers.length > 1 && (
                                        <div className="flex gap-2.5 overflow-x-auto hide-scrollbar pb-2 justify-start sm:justify-center snap-x">
                                            {savedUsers.map(u => (
                                                <button 
                                                    key={u.id + u.dbName} 
                                                    type="button" 
                                                    onClick={() => { setSelectedSavedUser(u); setFastLoginPassword(''); setError(''); }} 
                                                    className={`snap-center p-2 rounded-2xl border-2 transition-all shrink-0 w-[72px] sm:w-20 flex flex-col items-center ${selectedSavedUser.dbName === u.dbName && selectedSavedUser.id === u.id ? 'border-[#EA580C] bg-orange-50/60 scale-105 shadow-sm' : 'border-slate-100 bg-white opacity-60 hover:opacity-100'}`}
                                                >
                                                    <div className={`w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center font-black text-sm mb-1 transition-colors ${selectedSavedUser.dbName === u.dbName && selectedSavedUser.id === u.id ? 'bg-[#EA580C] text-white shadow-md' : 'bg-slate-200 text-slate-500'}`}>
                                                        {u.name.charAt(0)}
                                                    </div>
                                                    <p className="text-[9px] font-bold text-slate-700 truncate w-full px-0.5">{u.name.split(' ')[0]}</p>
                                                    <p className="text-[8px] font-bold text-slate-400 truncate w-full mt-0.5">{u.restaurant_name}</p>
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="pt-1 mb-2">
                                        <h2 className="text-xl font-black text-slate-800">مرحباً، {selectedSavedUser.name.split(' ')[0]}</h2>
                                        <p className="text-xs font-bold text-[#EA580C] mt-1"><i className="fas fa-store ml-1"></i> {selectedSavedUser.restaurant_name}</p>
                                    </div>

                                    <div className="input-group">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            value={fastLoginPassword} 
                                            onChange={(e) => setFastLoginPassword(e.target.value)} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right pr-4" 
                                            placeholder="كلمة المرور" 
                                        />
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none"
                                        >
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>

                                    <div className="flex justify-between items-center text-xs px-1">
                                        <button type="button" onClick={openRecovery} className="text-rose-500 hover:text-rose-600 font-bold transition-colors">
                                            نسيت كلمة المرور؟
                                        </button>
                                    </div>

                                    <button 
                                        type="submit" 
                                        disabled={loading} 
                                        className="w-full bg-[#EA580C] hover:bg-orange-700 text-white font-black py-3.5 rounded-xl shadow-lg shadow-orange-500/25 transition-all flex justify-center items-center gap-2 text-base active:scale-95"
                                    >
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <><i className="fas fa-sign-in-alt"></i> فتح الكاشير</>}
                                    </button>

                                    <button type="button" onClick={() => setActiveTab('login')} className="w-full text-slate-400 hover:text-slate-700 font-bold text-xs pt-1 transition-colors">
                                        الدخول بحساب أو مطعم مختلف
                                    </button>
                                </form>
                            )}

                            {/* 2. تسجيل الدخول العادي */}
                            {activeTab === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-4 fade-up">
                                    {availableRestaurants.length > 0 ? (
                                        <div className="input-group">
                                            <select 
                                                value={selectedDbForLogin} 
                                                onChange={(e) => setSelectedDbForLogin(e.target.value)} 
                                                className="input-field pr-4 appearance-none cursor-pointer text-slate-700 font-bold" 
                                                required
                                            >
                                                {availableRestaurants.map(r => <option key={r.dbName} value={r.dbName}>{r.restaurantName}</option>)}
                                            </select>
                                            <i className="fas fa-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                                        </div>
                                    ) : (
                                        <div className="text-center p-3 bg-amber-50 text-amber-700 rounded-xl text-xs font-bold">لا يوجد مطاعم مسجلة، يرجى التأسيس أولاً.</div>
                                    )}

                                    <div className="input-group">
                                        <input 
                                            type="tel" 
                                            name="phone" 
                                            value={formData.phone} 
                                            onChange={handleChange} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right pr-4" 
                                            placeholder="رقم الهاتف" 
                                            disabled={availableRestaurants.length === 0} 
                                        />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>

                                    <div className="input-group">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            name="password" 
                                            value={formData.password} 
                                            onChange={handleChange} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right pr-4" 
                                            placeholder="كلمة المرور" 
                                            disabled={availableRestaurants.length === 0} 
                                        />
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none"
                                        >
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>

                                    <div className="flex justify-end text-xs px-1">
                                        <button type="button" onClick={openRecovery} className="text-rose-500 hover:text-rose-600 font-bold transition-colors">
                                            نسيت كلمة المرور؟
                                        </button>
                                    </div>

                                    <button 
                                        type="submit" 
                                        disabled={loading || availableRestaurants.length === 0} 
                                        className="w-full bg-[#EA580C] hover:bg-orange-700 text-white font-black py-3.5 rounded-xl shadow-lg shadow-orange-500/25 transition-all flex justify-center items-center gap-2 text-base active:scale-95 disabled:opacity-50"
                                    >
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : 'تسجيل الدخول'}
                                    </button>

                                    {savedUsers.length > 0 && (
                                        <button type="button" onClick={() => setActiveTab('fast-login')} className="w-full text-center text-slate-500 hover:text-slate-800 font-bold text-xs pt-1 transition-colors">
                                            <i className="fas fa-users text-[10px] ml-1"></i> العودة لقائمة الحسابات المحفوظة
                                        </button>
                                    )}
                                </form>
                            )}

                            {/* 3. تأسيس مطعم جديد */}
                            {activeTab === 'register' && (
                                <form onSubmit={handleRegister} className="space-y-3.5 fade-up">
                                    <div className="input-group">
                                        <input type="text" name="restaurantName" value={formData.restaurantName} onChange={handleChange} required className="input-field pr-4" placeholder="اسم المطعم الجديد" />
                                        <i className="fas fa-store input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input type="text" name="ownerName" value={formData.ownerName} onChange={handleChange} required className="input-field pr-4" placeholder="اسم المدير المسئول" />
                                        <i className="fas fa-user-tie input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input type="tel" name="phone" value={formData.phone} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right pr-4" placeholder="رقم الهاتف للدخول" />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>
                                    <div className="input-group">
                                        <input type={showPassword ? "text" : "password"} name="password" value={formData.password} onChange={handleChange} required dir="ltr" className="input-field text-left placeholder:text-right pr-4" placeholder="كلمة المرور" />
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none"
                                        >
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                    
                                    <p className="text-[10px] font-bold text-slate-400 leading-relaxed px-1">
                                        * يتم حفظ بيانات المطعم بالكامل على متصفحك محلياً لضمان السرعة والخصوصية.
                                    </p>

                                    <button 
                                        type="submit" 
                                        disabled={loading} 
                                        className="w-full bg-gradient-to-l from-[#EA580C] to-[#F97316] text-white font-black py-3.5 rounded-xl shadow-lg shadow-orange-500/25 transition-all text-base active:scale-95"
                                    >
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : 'تأسيس المطعم الآن'}
                                    </button>
                                </form>
                            )}

                            {/* 4. استعادة الحساب بمفتاح الأمان (Security Key Recovery Tab) */}
                            {activeTab === 'recover' && (
                                <form onSubmit={handleRecoverPassword} className="space-y-3.5 fade-up">
                                    <div className="text-center mb-3">
                                        <div className="w-10 h-10 rounded-full bg-orange-50 text-[#EA580C] flex items-center justify-center text-lg mx-auto mb-2">
                                            <i className="fas fa-key"></i>
                                        </div>
                                        <h3 className="font-black text-slate-800 text-base">استعادة كلمة المرور</h3>
                                        <p className="text-[10px] font-bold text-slate-400 mt-0.5">أدخل مفتاح الأمان المسجل في إعدادات مطعمك</p>
                                    </div>

                                    {availableRestaurants.length > 1 && (
                                        <div className="input-group">
                                            <select 
                                                value={selectedDbForLogin} 
                                                onChange={(e) => setSelectedDbForLogin(e.target.value)} 
                                                className="input-field pr-4 appearance-none cursor-pointer text-slate-700 font-bold text-xs" 
                                                required
                                            >
                                                {availableRestaurants.map(r => <option key={r.dbName} value={r.dbName}>{r.restaurantName}</option>)}
                                            </select>
                                            <i className="fas fa-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                                        </div>
                                    )}

                                    <div className="input-group">
                                        <input 
                                            type="tel" 
                                            name="phone" 
                                            value={recoveryData.phone} 
                                            onChange={handleRecoveryChange} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right pr-4 text-xs sm:text-sm" 
                                            placeholder="رقم الهاتف المسجل" 
                                        />
                                        <i className="fas fa-phone input-icon"></i>
                                    </div>

                                    <div className="input-group">
                                        <input 
                                            type="text" 
                                            name="securityKey" 
                                            value={recoveryData.securityKey} 
                                            onChange={(e) => setRecoveryData({...recoveryData, securityKey: e.target.value.toUpperCase()})} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-center font-black tracking-widest uppercase pr-4 text-[#EA580C] placeholder:tracking-normal placeholder:text-slate-400 text-xs sm:text-sm" 
                                            placeholder="مفتاح الأمان (مثال: A1B2-C3D4)" 
                                        />
                                        <i className="fas fa-shield-alt input-icon"></i>
                                    </div>

                                    <div className="input-group">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            name="newPassword" 
                                            value={recoveryData.newPassword} 
                                            onChange={handleRecoveryChange} 
                                            required 
                                            dir="ltr" 
                                            className="input-field text-left placeholder:text-right pr-4 text-xs sm:text-sm" 
                                            placeholder="كلمة المرور الجديدة" 
                                        />
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none"
                                        >
                                            <i className={`fas ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>

                                    <button 
                                        type="submit" 
                                        disabled={loading} 
                                        className="w-full bg-[#EA580C] hover:bg-orange-700 text-white font-black py-3.5 rounded-xl shadow-lg shadow-orange-500/25 transition-all text-sm active:scale-95 mt-1"
                                    >
                                        {loading ? <i className="fas fa-circle-notch fa-spin"></i> : 'تأكيد واستعادة الحساب'}
                                    </button>

                                    <button 
                                        type="button" 
                                        onClick={() => { setActiveTab('login'); setError(''); setSuccessMsg(''); }} 
                                        className="w-full text-slate-400 hover:text-slate-700 font-bold text-xs pt-1 transition-colors"
                                    >
                                        إلغاء والعودة لتسجيل الدخول
                                    </button>
                                </form>
                            )}

                        </div>
                    </div>
                    
                    <p className="text-center text-slate-500 text-[11px] font-bold mt-6 tracking-wide">
                        جميع البيانات مخزنة محلياً على جهازك بواسطة تقنية <span className="text-slate-300">IndexedDB</span>
                    </p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SubscriptionsApp />);
    </script>
</body>
</html>
